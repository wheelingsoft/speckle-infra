mode: standalone

# Credentials come from the minio-credentials secret (see secrets/minio-credentials.yaml.template)
existingSecret: minio-credentials

persistence:
  enabled: true
  size: 10Gi

service:
  type: LoadBalancer  # Needs a public IP so browsers can fetch pre-signed URLs directly
  port: 9000

consoleService:
  type: ClusterIP

buckets:
  - name: speckle
    policy: none
    purge: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
