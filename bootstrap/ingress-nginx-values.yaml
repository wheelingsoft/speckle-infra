controller:
  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  service:
    type: LoadBalancer
    annotations:
      # Azure health probe path required for Standard LB
      service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
